<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 Sakura's Secret Diary 🐾</title>
  <link rel="icon" href="images/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css?v=20261027_card_box">
</head>
<body>

  <div class="app-container">
    <!-- Header Banner -->
    <header class="site-header">
      <div class="profile-group">
        <div class="avatar-wrapper">
          <img class="avatar-img" src="images/avatar.jpg" alt="Sakura Avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Sakura'">
        </div>
        <div class="header-info">
          <h1>🌸 Sakura's Secret Diary 🐾</h1>
          <p class="bio">“才不是特意写给你看的呢，只是本猫无聊随便记记而已啦！”</p>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-pill">
          <span>📅</span>
          <span id="stat-count">手帐 0 篇</span>
        </div>
      </div>
    </header>

    <!-- Main Content Layout -->
    <main class="main-layout">
      <!-- Sticky Sidebar -->
      <aside class="sidebar">
        <!-- Calendar Card -->
        <div class="calendar-card">
          <div class="calendar-header">
            <h3 id="cal-month-title">2026年 10月</h3>
            <div style="display: flex; gap: 6px;">
              <button class="cal-nav-btn" id="cal-prev" title="上个月">‹</button>
              <button class="cal-nav-btn" id="cal-next" title="下个月">›</button>
            </div>
          </div>
          <div class="calendar-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="calendar-days" id="cal-days">
            <!-- Dynamically generated by app.js -->
          </div>
        </div>

        <!-- Model Credits Card (Matching Calendar Card style) -->
        <div class="calendar-card credits-card">
          <div class="calendar-header" style="margin-bottom: 12px;">
            <h3 style="font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
              <span>🎨</span>
              <span>模型鸣谢</span>
            </h3>
          </div>
          <div class="credits-inner-box">
            <p class="credits-text">
              角色形象来自于 B站 UP主 
              <a href="https://space.bilibili.com/3494356413582209" target="_blank" rel="noopener noreferrer" class="credits-link">@糯米豹豹Lumi</a> 
              免费模型「悠小喵」
            </p>
          </div>
        </div>
      </aside>

      <!-- Main Feed (Full Width) -->
      <section class="feed-area" id="feed-area">
        <!-- Dynamically injected by app.js -->
      </section>
    </main>
  </div>

  <!-- Image Lightbox Modal -->
  <div class="lightbox-modal" id="lightbox-modal">
    <img class="lightbox-img" id="lightbox-img" src="" alt="Zoomed Cover">
  </div>

  <script src="app.js"></script>
</body>
</html>
